<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Xander Greeting</title>

  <style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .greeting-card {
    width: 100%;
    max-width: 420px;
    margin-left: 24px;
    padding: 26px 30px;
    border: 2px solid #607C6E;
    border-radius: 24px;
    background: #232625;
    text-align: left;
  }

  .greeting-line {
    margin: 0;
    color: #EDECE9;
    font-size: 28px;
    font-weight: 500;
    line-height: 1.2;
  }

  .name {
    color: #607C6E;
    font-weight: 600;
  }
</style>
</head>

<body>
  <div class="greeting-card">
    <p id="greeting" class="greeting-line"></p>
    </div>

<script>
  function updateGreeting() {
    const hour = new Date().getHours();
    let greeting;

    if (hour < 12) {
      greeting = "Good Morning";
    } else if (hour < 18) {
      greeting = "Good Afternoon";
    } else {
      greeting = "Good Evening";
    }

    document.getElementById("greeting").innerHTML =
      `${greeting}, <span class="name">Xander</span>`;
  }

  updateGreeting();
  setInterval(updateGreeting, 60000);
</script>
</body>
</html>
